# Nginx configuration for Best on Click
# Place this in your nginx sites-available directory

server {
    listen 3000;
    server_name localhost 192.168.1.116;
    
    # Document root
    root d:/GP/public;
    index index.html;
    
    # MIME types configuration
    location ~* \.(js|mjs)$ {
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Accept, Accept-Encoding, Authorization, Content-Type, DNT, Origin, User-Agent, X-CSRFToken, X-Requested-With";
        try_files $uri =404;
    }
    
    location ~* \.css$ {
        add_header Content-Type "text/css; charset=utf-8";
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    
    location ~* \.json$ {
        add_header Content-Type "application/json; charset=utf-8";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    
    location ~* \.svg$ {
        add_header Content-Type "image/svg+xml; charset=utf-8";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    
    # Handle OPTIONS requests for CORS
    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Accept, Accept-Encoding, Authorization, Content-Type, DNT, Origin, User-Agent, X-CSRFToken, X-Requested-With";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 200;
        }
        
        # Add CORS headers to all responses
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Accept-Encoding, Authorization, Content-Type, DNT, Origin, User-Agent, X-CSRFToken, X-Requested-With" always;
        
        try_files $uri $uri/ /index.html;
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logging
    access_log /var/log/nginx/bestonclick_access.log;
    error_log /var/log/nginx/bestonclick_error.log;
}